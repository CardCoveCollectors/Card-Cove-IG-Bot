name: TEST - Scan TCG news feeds

# Disposable test workflow. Checks which RSS feeds are actually reachable
# and well-formed, so we know what to build fetch_news.py against. Safe to
# delete once the real news pipeline is built and verified.

on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate feeds
        run: |
          urls=(
            "https://news.google.com/rss/search?q=%22Pokemon%20TCG%22&hl=en-US&gl=US&ceid=US:en"
            "https://news.google.com/rss/search?q=%22One%20Piece%20Card%20Game%22&hl=en-US&gl=US&ceid=US:en"
            "https://www.bing.com/news/search?q=%22Pokemon+TCG%22&format=rss"
            "https://www.bing.com/news/search?q=%22One+Piece+Card+Game%22&format=rss"
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            code=$(curl -s -L -A "Mozilla/5.0 (compatible; CardCoveNewsBot/1.0)" -o /tmp/out.xml -w "%{http_code}" "$url" || echo "FAILED")
            echo "HTTP status: $code"
            if [ -f /tmp/out.xml ]; then
              echo "--- first 800 chars ---"
              head -c 800 /tmp/out.xml
              echo
              echo "--- item/entry count ---"
              grep -o -E "<item>|<entry>" /tmp/out.xml | wc -l
              rm -f /tmp/out.xml
            fi
            echo
            echo
          done
