name: Post Pokemon to Instagram

on:
  schedule:
    # 23:00 UTC, Mon/Wed/Fri = 7pm Eastern (6pm during EST) — evening hours
    # consistently show the strongest Instagram engagement across most days.
    # Adjust any time: https://crontab.guru is handy for editing this.
    # Note: GitHub Actions cron doesn't auto-adjust for daylight saving, so
    # this will drift by an hour twice a year — not worth worrying about.
    - cron: "0 23 * * 1,3,5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the generated image back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build image + caption
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python scripts/main_pokemon.py build

      - name: Commit generated image so it's publicly reachable
        run: |
          git config user.name "tcg-ig-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ state_pokemon.json
          git commit -m "Generate Pokemon post $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Wait for GitHub's CDN to pick up the new file
        run: sleep 15

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/main_pokemon.py publish
