name: Post Pokemon to Instagram

on:
  schedule:
    # 22:47 UTC, Mon/Wed/Fri = ~7pm Eastern (6pm during EST) — evening hours
    # consistently show the strongest Instagram engagement across most days.
    # Deliberately NOT on the hour (:00) — GitHub Actions queues scheduled
    # workflows worst at the top of every hour, since that's when the most
    # other repos' cron jobs fire too; an off-minute time meaningfully cuts
    # down queue delay (though GitHub doesn't guarantee an exact time either
    # way). Adjust any time: https://crontab.guru is handy for editing this.
    # Note: GitHub Actions cron doesn't auto-adjust for daylight saving, so
    # this will drift by an hour twice a year — not worth worrying about.
    - cron: "47 22 * * 1,3,5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the generated image back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build image + caption
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python scripts/main_pokemon.py build

      - name: Commit generated image so it's publicly reachable
        run: |
          git config user.name "tcg-ig-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ state_pokemon.json
          git commit -m "Generate Pokemon post $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          # Retry with rebase in case another pipeline's workflow pushed to
          # main at the same moment (can happen if two runs overlap, e.g.
          # manual test runs triggered close together, or GitHub Actions
          # delay causing two scheduled runs to land near each other).
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) — pulling and retrying..."
            git pull --rebase origin main
            sleep 5
          done

      - name: Wait for GitHub's CDN to pick up the new file
        run: sleep 15

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/main_pokemon.py publish
