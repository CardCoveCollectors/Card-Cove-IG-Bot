name: TEST - Pokemon JP Sets + Top 10 (temporary, safe to delete after)

# One-off manual test: lists all Japanese Pokemon sets, then runs the real
# fetch_prices_pokemon_jp.py script's Top 10 Most Expensive for one of
# them, then digs into why the known-expensive chase cards are missing.
# Doesn't touch posts/, doesn't publish anything, doesn't commit
# anything. Delete this file (and the workflow) once we're happy.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List modern-era (SV / Mega Evolution) Japanese Pokemon sets, properly date-sorted
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          python3 -c "
          import re, sys
          from datetime import datetime
          sys.path.insert(0, 'scripts')
          from fetch_prices_pokemon_jp import get_jp_sets

          MONTH_FIX = {'Decembre': 'December'}

          def parse_date(raw):
              if not raw:
                  return None
              cleaned = re.sub(r'(\d+)(st|nd|rd|th)', r'\1', raw)
              for bad, good in MONTH_FIX.items():
                  cleaned = cleaned.replace(bad, good)
              for fmt in ('%d %B, %Y', '%d %B %Y'):
                  try:
                      return datetime.strptime(cleaned, fmt)
                  except ValueError:
                      continue
              return None

          sets = get_jp_sets()
          print(f'Found {len(sets)} total Japanese sets')

          # Modern era only: set_code starting with sv/zsv/rsv/me (mirrors the
          # English FEATURED_SETS lineup's era), so we're not wading through
          # 20 years of history to pick posting candidates.
          modern = [s for s in sets if re.match(r'^(sv|zsv|rsv|me)', (s.get('set_code') or ''), re.I)]
          dated = [(parse_date(s.get('release_date')), s) for s in modern]
          dated = [d for d in dated if d[0] is not None]
          dated.sort(key=lambda d: d[0], reverse=True)

          print(f'{len(dated)} modern-era sets with a parseable date:')
          for dt, s in dated[:40]:
              print(f\"  set_id={s['set_id']}  set_code={s.get('set_code')}  cards={s.get('card_count')}  released={dt.date()}  -  {s['name']}\")

          undated_modern = [s for s in modern if parse_date(s.get('release_date')) is None]
          if undated_modern:
              print(f'{len(undated_modern)} modern-era sets with an unparseable/missing date:')
              for s in undated_modern[:20]:
                  print(f\"  set_id={s['set_id']}  set_code={s.get('set_code')}  cards={s.get('card_count')}  released={s.get('release_date')!r}  -  {s['name']}\")
          "

      - name: Top 10 Most Expensive — SV2a (Pokemon Card 151, Japanese), via the fixed /search-based script
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: python scripts/fetch_prices_pokemon_jp.py SV2a

      - name: Does the search index even have SV2a's Charizard ex?
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          curl -s -H "X-API-Key: $POKEWALLET_API_KEY" \
            "https://api.pokewallet.io/search?q=charizard+ex+151&limit=20" | python3 -m json.tool

      - name: How many total /search pages does "SV2a" actually span, and where do 200+ priced results come from?
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from fetch_prices_pokemon_jp import _session, _headers, API_BASE, _resolve_jp_set

          info = _resolve_jp_set('SV2a')
          target_id = info['set_id']
          print(f\"Target set_id={target_id}, expected card_count={info.get('card_count')}\")

          seen = set()
          page = 1
          while page <= 10:
              resp = _session.get(f'{API_BASE}/search', params={'q': 'SV2a', 'page': page, 'limit': 100}, headers=_headers(), timeout=30)
              resp.raise_for_status()
              payload = resp.json()
              batch = payload.get('results', [])
              matched_this_page = 0
              top_price_this_page = 0
              for c in batch:
                  info2 = c.get('card_info') or {}
                  if info2.get('set_id') != target_id:
                      continue
                  matched_this_page += 1
                  seen.add(c.get('id'))
                  tcg = c.get('tcgplayer') or {}
                  prices = tcg.get('prices') or []
                  vals = [p.get('market_price') for p in prices if p.get('market_price') is not None]
                  if vals:
                      top_price_this_page = max(top_price_this_page, max(vals))
              total_pages = (payload.get('pagination') or {}).get('total_pages')
              print(f'page {page}: {len(batch)} raw results, {matched_this_page} matched set_id, running unique total={len(seen)}, max price seen this page=\${top_price_this_page:.2f}, total_pages={total_pages}')
              if not batch:
                  break
              page += 1
          "
