name: TEST - PokeWallet JP Sets (temporary, safe to delete after)

# One-off manual test to see what the /op/sets?language=jp response looks
# like, and whether "Alt Art" (or similar) shows up in JP card names.
# Doesn't touch posts/, doesn't publish anything, doesn't commit anything.
# Delete this file (and the workflow) once we've seen the output.
#
# Uses curl (not Python's urllib) to fetch, since urllib's default User-Agent
# gets blocked with a 403 by the API's protection — curl's User-Agent doesn't.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scan a few JP sets for "alt" in card names
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          declare -A sets=(
            ["-3"]="OP01-JP Romance Dawn"
            ["-25"]="OP07-JP 500 Years in the Future"
            ["-28"]="OP16-JP The Time of Battle"
            ["-8"]="EB-01-JP Memorial Collection"
          )

          for gid in "${!sets[@]}"; do
            label="${sets[$gid]}"
            echo ""
            echo "=== $label (group_id $gid) ==="
            curl -s -H "X-API-Key: $POKEWALLET_API_KEY" \
              "https://api.pokewallet.io/op/sets/$gid?page=1&limit=200" > /tmp/resp.json

            python3 - "$label" "$gid" << 'EOF'
          import json, sys

          label, gid = sys.argv[1], sys.argv[2]
          with open("/tmp/resp.json") as f:
              data = json.load(f)

          total = data.get("total")
          cards = data.get("data", [])
          matches = [c["name"] for c in cards if c.get("name") and "alt" in c["name"].lower()]

          print(f"total={total}, fetched={len(cards)}, alt-matches={len(matches)}")
          for m in matches[:20]:
              print("   ", m)
          if not matches:
              print("   (no 'alt' matches — showing 5 sample names instead)")
              for c in cards[:5]:
                  print("   sample:", c.get("name"))
          EOF
          done
