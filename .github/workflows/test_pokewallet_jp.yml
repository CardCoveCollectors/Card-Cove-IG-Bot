name: TEST - Pokemon JP Sets + Top 10 (temporary, safe to delete after)

# One-off manual test: lists all Japanese Pokemon sets, then runs the real
# fetch_prices_pokemon_jp.py script's Top 10 Most Expensive for one of
# them. Doesn't touch posts/, doesn't publish anything, doesn't commit
# anything. Delete this file (and the workflow) once we're happy.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List modern-era (SV / Mega Evolution) Japanese Pokemon sets, properly date-sorted
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          python3 -c "
          import re, sys
          from datetime import datetime
          sys.path.insert(0, 'scripts')
          from fetch_prices_pokemon_jp import get_jp_sets

          MONTH_FIX = {'Decembre': 'December'}

          def parse_date(raw):
              if not raw:
                  return None
              cleaned = re.sub(r'(\d+)(st|nd|rd|th)', r'\1', raw)
              for bad, good in MONTH_FIX.items():
                  cleaned = cleaned.replace(bad, good)
              for fmt in ('%d %B, %Y', '%d %B %Y'):
                  try:
                      return datetime.strptime(cleaned, fmt)
                  except ValueError:
                      continue
              return None

          sets = get_jp_sets()
          print(f'Found {len(sets)} total Japanese sets')

          # Modern era only: set_code starting with sv/zsv/rsv/me (mirrors the
          # English FEATURED_SETS lineup's era), so we're not wading through
          # 20 years of history to pick posting candidates.
          modern = [s for s in sets if re.match(r'^(sv|zsv|rsv|me)', (s.get('set_code') or ''), re.I)]
          dated = [(parse_date(s.get('release_date')), s) for s in modern]
          dated = [d for d in dated if d[0] is not None]
          dated.sort(key=lambda d: d[0], reverse=True)

          print(f'{len(dated)} modern-era sets with a parseable date:')
          for dt, s in dated[:40]:
              print(f\"  set_id={s['set_id']}  set_code={s.get('set_code')}  cards={s.get('card_count')}  released={dt.date()}  -  {s['name']}\")

          undated_modern = [s for s in modern if parse_date(s.get('release_date')) is None]
          if undated_modern:
              print(f'{len(undated_modern)} modern-era sets with an unparseable/missing date:')
              for s in undated_modern[:20]:
                  print(f\"  set_id={s['set_id']}  set_code={s.get('set_code')}  cards={s.get('card_count')}  released={s.get('release_date')!r}  -  {s['name']}\")
          "

      - name: Top 10 Most Expensive — SV2a (Pokemon Card 151, Japanese), with early-stop bug fixed
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: python scripts/fetch_prices_pokemon_jp.py SV2a

      - name: Top 10 Cheapest ARs — SV2a, filtered to Art Rare / Special Art Rare
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from fetch_prices_pokemon_jp import top_n_by_price

          top, expected, priced = top_n_by_price('SV2a', n=10, most_expensive=False, rarities=['Art Rare', 'Special Art Rare'])
          print(f'[diagnostic] set has {expected} nominal cards, {priced} matched with a price')
          for i, c in enumerate(top, 1):
              print(f\"{i}. {c['name']} (#{c['number']} {c['rarity']}) - \${c['market_price']:.2f}\")
          "
