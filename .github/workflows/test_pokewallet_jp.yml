name: TEST - Pokemon JP Sets + Top 10 (temporary, safe to delete after)

# One-off manual test: lists all Japanese Pokemon sets, then runs the real
# fetch_prices_pokemon_jp.py script's Top 10 Most Expensive for one of
# them. Doesn't touch posts/, doesn't publish anything, doesn't commit
# anything. Delete this file (and the workflow) once we're happy.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List all Japanese Pokemon sets
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from fetch_prices_pokemon_jp import get_jp_sets
          sets = get_jp_sets()
          print(f'Found {len(sets)} Japanese sets')
          for s in sorted(sets, key=lambda x: x.get('release_date') or '', reverse=True)[:40]:
              print(f\"  set_id={s['set_id']}  set_code={s.get('set_code')}  cards={s.get('card_count')}  released={s.get('release_date')}  -  {s['name']}\")
          "

      - name: Top 10 Most Expensive — SV2a (Pokemon Card 151, Japanese)
        env:
          POKEWALLET_API_KEY: ${{ secrets.POKEWALLET_API_KEY }}
        run: python scripts/fetch_prices_pokemon_jp.py 23599
